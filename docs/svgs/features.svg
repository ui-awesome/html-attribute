<svg viewBox="0 0 1200 380" width="100%" height="340" xmlns="http://www.w3.org/2000/svg">
    <style>
        text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .box-bg { fill: #e6f4ea; stroke: #a7cdb3; stroke-width: 1; }
        .title { font-weight: 700; font-size: 16px; fill: #1a202c; }
        .content { font-size: 13px; fill: #4a5568; }
    </style>

    <g>
        <rect class="box-bg" x="20" y="20" width="570" height="100" rx="6"/>
        <rect x="20" y="20" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="50">Attribute APIs</text>
        <text class="content" x="40" y="78">Focused traits for shared HTML attributes and immutable setters</text>
        <text class="content" x="40" y="98">Built on addAttribute() with null removal semantics</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="20" width="570" height="100" rx="6"/>
        <rect x="610" y="20" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="50">ElementAttribute Enum</text>
        <text class="content" x="630" y="78">Element-specific attribute names without element trait duplication</text>
        <text class="content" x="630" y="98">Keeps ownership in ui-awesome/html while sharing constants</text>
    </g>

    <g>
        <rect class="box-bg" x="20" y="140" width="570" height="100" rx="6"/>
        <rect x="20" y="140" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="170">Global Attributes</text>
        <text class="content" x="40" y="198">class, id, lang, role, style, tabindex and related global APIs</text>
        <text class="content" x="40" y="218">Enum-backed values for consistent rendering and validation</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="140" width="570" height="100" rx="6"/>
        <rect x="610" y="140" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="170">Prefix Attributes</text>
        <text class="content" x="630" y="198">aria-*, data-* and on* helpers with prefix normalization</text>
        <text class="content" x="630" y="218">Safe removal and batch assignment through attribute bags</text>
    </g>

    <g>
        <rect class="box-bg" x="20" y="260" width="570" height="100" rx="6"/>
        <rect x="20" y="260" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="290">Typed Values</text>
        <text class="content" x="40" y="318">Stringable, UnitEnum, scalar and null support across setters</text>
        <text class="content" x="40" y="338">Dedicated enums for rel, target, crossorigin, direction and more</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="260" width="570" height="100" rx="6"/>
        <rect x="610" y="260" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="290">Validation</text>
        <text class="content" x="630" y="318">oneOf() checks and numeric constraints for strict attribute values</text>
        <text class="content" x="630" y="338">Deterministic exception messages for reliable test coverage</text>
    </g>
</svg>
